<div class="register-page">
  <p-toast />

  <!-- Brand panel -->
  <div class="brand-panel">
    <div class="brand-logo">ב</div>
    <h1 class="brand-title">ביד עמי</h1>
    <div class="brand-divider"></div>
    <p class="brand-subtitle">מערכת לניהול מכשירים,<br />השאלות וסניפים</p>
  </div>

  <!-- Form panel -->
  <div class="form-panel">
    <div class="form-card">

      <!-- Mobile logo -->
      <div class="mobile-logo">
        <div class="mobile-logo-circle">ב</div>
        <span class="mobile-logo-text">ביד עמי</span>
      </div>

      <div class="card-header">
        <h2>הרשמה</h2>
        <p>צור חשבון חדש במערכת</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="submit()" class="register-form">

        <div class="field">
          <label for="userName">שם משתמש</label>
          <input id="userName" pInputText formControlName="userName" autocomplete="username" />
          <small class="error" *ngIf="isUserNameInvalid()">יש להזין שם משתמש</small>
        </div>

        <div class="field">
          <label for="email">אימייל</label>
          <input id="email" pInputText type="email" formControlName="email" autocomplete="email" />
          <small class="error" *ngIf="hasError('email', 'required')">יש להזין כתובת אימייל</small>
          <small class="error" *ngIf="hasError('email', 'email') && !hasError('email', 'required')">יש להזין כתובת אימייל תקינה</small>
        </div>

        <div class="field">
          <label for="password">סיסמה</label>
          <p-password
            id="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            inputStyleClass="w-full"
            styleClass="w-full"
            autocomplete="new-password"
            [inputStyle]="{ width: '100%' }"
          />
          <small class="error" *ngIf="hasError('password', 'required')">יש להזין סיסמה</small>
          <small class="error" *ngIf="hasError('password', 'minlength') && !hasError('password', 'required')">הסיסמה חייבת להכיל לפחות 6 תווים</small>
        </div>

        <div class="field">
          <label for="confirmPassword">אימות סיסמה</label>
          <p-password
            id="confirmPassword"
            formControlName="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            inputStyleClass="w-full"
            styleClass="w-full"
            autocomplete="new-password"
            [inputStyle]="{ width: '100%' }"
          />
          <small class="error" *ngIf="hasError('confirmPassword', 'required')">יש להזין קוד אימות</small>
          <small class="error" *ngIf="hasPasswordMismatch()">הסיסמאות אינן זהות</small>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading() || registerForm.invalid">
          <i class="pi pi-user-plus" *ngIf="!loading()"></i>
          <i class="pi pi-spin pi-spinner" *ngIf="loading()"></i>
          <span>{{ loading() ? 'מוסיף משתמש...' : 'הרשמה' }}</span>
        </button>

        <div class="auth-link-row">
          <a routerLink="/login" class="auth-link">כבר יש לך חשבון? להתחברות</a>
        </div>

      </form>
    </div>
  </div>
</div>
