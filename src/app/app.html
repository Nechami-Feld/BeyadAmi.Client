<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen()" [class.logged-out]="!isAuthenticated() || isLoginRoute()">

  <aside class="sidebar" *ngIf="isAuthenticated() && !isLoginRoute()">
    <div class="sidebar-header">
      <span class="logo-text" *ngIf="sidebarOpen()">ביד עמי</span>
      <div class="header-actions" *ngIf="sidebarOpen()">
        <span class="user-badge">{{ currentUserName() }}</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()" type="button">
        <i [class]="sidebarOpen() ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [title]="item.label"
      >
        <i [class]="item.icon"></i>
        <span class="nav-label" *ngIf="sidebarOpen()">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="sidebarOpen()">
      <button type="button" class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>התנתקות</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>

</div>
